<div class="contact-staff-list-wrapper">
  <div class="contact-staff-header">
    <div class="contact-staff-title">
      <h2>Staff Master</h2>
    </div>
    <div class="contact-staff-actions">
      @if (canAddStaff) {
        <p-button
          icon="pi pi-plus"
          label="New Staff"
          routerLink="/contact/staff/add"
          severity="primary"
        />
      }
      @if (canImportStaff) {
        <p-button
          icon="pi pi-file-import"
          label="Import"
          severity="secondary"
          [outlined]="true"
          styleClass="import-btn"
          (click)="navigateToImport()"
        />
      }
    </div>
  </div>

  <app-contact-staff-filter-component
    [(filter)]="filter"
    [canViewAllDept]="canViewAllDept"
    (applied)="onFilterChange(filter())"
  ></app-contact-staff-filter-component>

  <app-contact-staff-list
    #table
    [filter]="filter()"
    [first]="first()"
    [canEdit]="canEditStaff"
    [canSecurity]="canSecurityStaff"
    [canChangeStatus]="canChangeStatusStaff"
    (filterChange)="filter.set($event)"
    (pageChange)="onFirstChange($event)"
  ></app-contact-staff-list>
</div>
